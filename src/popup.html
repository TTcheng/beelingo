<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>BeeLingo</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 13px;
      }
      body {
        background: #fafafa;
        color: #1a1a1a;
        padding: 14px 16px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1e1e; color: #e8e8e8; }
      }
      h1 { margin: 0 0 8px; font-size: 16px; }
      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        background: rgba(245, 183, 0, 0.12);
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2c7a2c;
        display: inline-block;
        margin-right: 6px;
      }
      .status.err .dot { background: #c0392b; }
      a.btn {
        display: block;
        text-align: center;
        padding: 8px 12px;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
        background: transparent;
      }
      a.btn:hover { background: rgba(245, 183, 0, 0.18); }
    </style>
  </head>
  <body>
    <h1>🐝 蜂译</h1>
    <div id="status" class="status"><span><span class="dot"></span>就绪</span></div>
    <a id="options" class="btn" href="#">打开设置</a>
    <script type="module" src="./popup/index.ts"></script>
  </body>
</html>
