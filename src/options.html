<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>BeeLingo · 蜂译 设置</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #6c6c6c;
        --border: #e5e5e5;
        --accent: #f5b700;
        --error: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #e8e8e8;
          --muted: #999;
          --border: #3a3a3a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.55;
        padding: 24px;
        max-width: 640px;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      .subtitle { color: var(--muted); margin-bottom: 24px; }
      section {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px 18px;
        margin-bottom: 14px;
      }
      section h2 {
        font-size: 14px;
        margin: 0 0 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .row {
        display: grid;
        grid-template-columns: 140px 1fr;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .row:last-child { margin-bottom: 0; }
      label { color: var(--muted); font-size: 13px; }
      input[type='text'],
      input[type='password'],
      input[type='url'],
      select {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
      }
      input:focus, select:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
      }
      button {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1a1a;
        font-weight: 600;
      }
      button:hover { background: rgba(245, 183, 0, 0.15); }
      .status {
        font-size: 13px;
        color: var(--muted);
      }
      .status.ok { color: #2c7a2c; }
      .status.err { color: var(--error); }
      code {
        background: rgba(0, 0, 0, 0.06);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 12px;
      }
      .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>🐝 BeeLingo · 蜂译 设置</h1>
    <p class="subtitle">选中即译，蜂速可达</p>

    <section>
      <h2>翻译 API</h2>
      <div class="row">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
      </div>
      <div class="row">
        <label for="apiBaseUrl">API Base URL</label>
        <input type="url" id="apiBaseUrl" placeholder="https://api.MiniMax.chat/v1" />
      </div>
      <div class="row">
        <label for="model">模型</label>
        <input type="text" id="model" placeholder="MiniMax-M3" />
      </div>
      <div class="row">
        <label for="thinking">思维链</label>
        <select id="thinking">
          <option value="disabled">关闭（推荐，直接出译文）</option>
          <option value="adaptive">自适应（模型自行决定）</option>
        </select>
      </div>
      <div class="actions">
        <button id="validate" type="button">验证 Key</button>
        <span id="validateStatus" class="status"></span>
      </div>
    </section>

    <section>
      <h2>语种</h2>
      <div class="row">
        <label for="sourceLang">源语言</label>
        <select id="sourceLang">
          <option value="auto">自动检测</option>
          <option value="zh">中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
          <option value="ko">韩文</option>
        </select>
      </div>
      <div class="row">
        <label for="targetLang">目标语言</label>
        <select id="targetLang">
          <option value="zh">中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
          <option value="ko">韩文</option>
        </select>
      </div>
    </section>

    <section>
      <h2>防滥用</h2>
      <div class="row">
        <label for="rateLimitPerMinute">每分钟上限</label>
        <select id="rateLimitPerMinute">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="30">30</option>
        </select>
      </div>
    </section>

    <div class="actions">
      <button id="save" type="button" class="primary">保存</button>
      <button id="reset" type="button">恢复默认</button>
      <span id="saveStatus" class="status"></span>
    </div>

    <script type="module" src="./options/index.ts"></script>
  </body>
</html>
